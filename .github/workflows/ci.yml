name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '24'

jobs:
  # Only run the expensive jobs for the parts of the monorepo that changed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      indexer: ${{ steps.filter.outputs.indexer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
            indexer:
              - 'indexer/**'

  api:
    name: API (Go)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    # Real dependencies rather than mocks, so the integration-flavoured tests
    # exercise the same drivers production uses.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meterrail
          POSTGRES_PASSWORD: meterrail
          POSTGRES_DB: meterrail_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meterrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Verify dependencies are tidy
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || { echo '::error::go.mod/go.sum are not tidy; run `make tidy`'; exit 1; }

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: apps/api
          args: --timeout=5m

      - name: Test
        env:
          DATABASE_URL: postgres://meterrail:meterrail@localhost:5432/meterrail_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build all binaries
        run: go build ./...

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: apps/api/coverage.out
          retention-days: 7

  web:
    name: Web (Next.js)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          # Placeholder values: the build only needs these to be present and
          # well-formed, and no secret is inlined into a CI artifact.
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_APP_NAME: Meterrail
        run: pnpm --filter @meterrail/web build

  indexer:
    name: Indexer (Envio)
    needs: changes
    if: needs.changes.outputs.indexer == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate types from the schema
        working-directory: indexer
        run: pnpm codegen

      - name: Typecheck handlers
        working-directory: indexer
        run: pnpm typecheck

  # A single required status check, so branch protection needs one entry rather
  # than one per job. It fails if any job failed, and passes when jobs were
  # legitimately skipped by the path filter.
  ci-ok:
    name: CI
    if: always()
    needs: [api, web, indexer]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: ${results}"
          for result in $results; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo '::error::at least one CI job did not pass'
              exit 1
            fi
          done
