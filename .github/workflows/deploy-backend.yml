name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (defaults to the current commit)'
        required: false
        type: string

# Never let two deploys race for the same host.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          # Cache layers in the registry so a dependency-only change does not
          # rebuild the world on every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key rather than trusting on first use, so a hijacked
          # DNS record cannot redirect the deploy to another machine.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync deployment files
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/ \
            "${{ secrets.DEPLOY_HOST }}:/opt/meterrail/deploy/"

      - name: Deploy
        env:
          IMAGE_TAG: ${{ inputs.tag || needs.build.outputs.tag }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_HOST }}" \
            "cd /opt/meterrail && \
             sed -i 's|^API_IMAGE=.*|API_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}|' .env.production && \
             IMAGE_TAG=${IMAGE_TAG} bash deploy/scripts/deploy.sh"

      - name: Verify the deployed service is healthy
        run: |
          # Poll from outside the host: this checks nginx, TLS and the app
          # together, which an on-host check would not.
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 https://api.example.com/health/ready > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "attempt ${attempt}/10 failed; retrying"
            sleep 10
          done
          echo '::error::the deployed API never became ready'
          exit 1
