# Hot reload for the API during development.
# Used by `make dev-api` when `air` is installed.

root = "."
tmp_dir = ".air"

[build]
  cmd = "go build -o ./.air/server ./cmd/server"
  bin = "./.air/server"
  full_bin = ""

  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  exclude_dir = [".air", "bin", "vendor", "testdata", "migrations"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  follow_symlink = false

  # Editors write files in bursts; without this air rebuilds several times per
  # save.
  delay = 500

  stop_on_error = true
  send_interrupt = true
  # Give the server its full graceful-shutdown window before SIGKILL.
  kill_delay = "2s"

  log = "air-errors.log"

[log]
  time = true
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
