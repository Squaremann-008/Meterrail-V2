user nginx;
# One worker per core; nginx works this out itself.
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $request_id is generated per request and forwarded to the API, which
    # reuses it as its correlation id — so one id joins nginx and app logs.
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    keepalive_timeout 65;
    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # --- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # --- rate limiting -----------------------------------------------------
    # A coarse outer limit; the API applies its own per-user limit behind it.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # --- upstreams ---------------------------------------------------------
    # Docker's embedded DNS round-robins across replicas of a scaled service.
    upstream meterrail_api {
        server api:8080 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream meterrail_asynqmon {
        server asynqmon:8080;
        keepalive 8;
    }

    upstream meterrail_web {
        server web:3000;
        keepalive 16;
    }

    # Real client IP when a CDN (Cloudflare) fronts this host. Without this the
    # API's rate limiter would see one address for every visitor.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Map the WebSocket upgrade header through the proxy.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
