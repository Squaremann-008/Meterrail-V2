# Meterrail API vhost.
#
# Replace api.example.com with your domain, then run
# `make tls-cert DOMAIN=api.example.com EMAIL=you@example.com` on the VPS to
# issue the certificate before enabling the TLS server block.

# Shared proxy settings. Included rather than repeated so a change to header
# forwarding cannot drift between locations.
map $host $meterrail_placeholder { default ''; }

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # ACME challenge must stay on plain HTTP for renewals to work.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Load balancer health check, answered without hitting the app.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS. Only enable after you are certain every subdomain serves HTTPS —
    # browsers cache this and it cannot be undone quickly.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    limit_conn conn_limit 50;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Health probes bypass the rate limiter so a monitoring system cannot lock
    # itself out.
    location /health {
        proxy_pass http://meterrail_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /v1/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://meterrail_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Stream responses straight through; the API returns small JSON and
        # buffering only adds latency.
        proxy_buffering off;
    }

    # The internal endpoints are service-token authenticated, but there is no
    # reason for them to be reachable from the internet at all.
    location /v1/internal/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;

        proxy_pass http://meterrail_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404 '{"error":{"code":"not_found","message":"unknown endpoint"}}';
        add_header Content-Type application/json;
    }
}

# --- queue dashboard -------------------------------------------------------
# Asynqmon has no authentication of its own, so basic auth is mandatory here.
# Generate the file with:
#   htpasswd -Bc deploy/nginx/.htpasswd admin
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name queues.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        auth_basic "Meterrail queues";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://meterrail_asynqmon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Asynqmon streams live queue updates over a websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# --- optional self-hosted frontend -----------------------------------------
# Only needed when running the `self-hosted-web` compose profile instead of
# deploying the frontend to Vercel.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Next.js fingerprints these filenames, so they are safe to cache forever.
    location /_next/static/ {
        proxy_pass http://meterrail_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://meterrail_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
